name: Release

# Tagging is the release. Pushing v1.2.3 builds the images and publishes them;
# nothing else does, so a green main branch never accidentally ships.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # write, not read: the last step creates the GitHub release for this tag.
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # arm64 matters: a large share of the people who will try this are on
      # Apple Silicon, and an amd64-only image fails for them at `docker run`.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: only runs when the two secrets exist, so a fork or a
      # repository without a Docker Hub account still publishes to ghcr.
      # The secrets have to be copied into env first — `secrets` is not
      # available to a step's `if`, and using it there makes GitHub reject
      # the whole workflow file rather than just that step.
      - name: Log in to Docker Hub
        id: dockerhub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          v="${{ steps.version.outputs.version }}"
          repo="${GITHUB_REPOSITORY,,}"
          tags="ghcr.io/${repo}:${v},ghcr.io/${repo}:latest"
          if [ "${{ steps.dockerhub.outcome }}" = "success" ]; then
            tags="${tags},docker.io/${DOCKERHUB_USERNAME}/holiaokho:${v}"
            tags="${tags},docker.io/${DOCKERHUB_USERNAME}/holiaokho:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The server reports this in the UI, the API and its logs, so a
          # published image has to carry the version it was tagged with.
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A tag on its own leaves the Releases page empty, which is where people
      # look to find out what changed and how to pull it.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "## Pull it"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${repo}:${VERSION}"
            if [ "${{ steps.dockerhub.outcome }}" = "success" ]; then
              echo "docker pull ${DOCKERHUB_USERNAME}/holiaokho:${VERSION}"
            fi
            echo '```'
            echo
            echo "Built for \`linux/amd64\` and \`linux/arm64\`."
            echo
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Holiaokho ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
