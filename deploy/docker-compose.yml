# Single-node Holiaokho with PostgreSQL. `docker compose up -d` then open http://localhost:8081
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: holiaokho
      POSTGRES_PASSWORD: holiaokho
      POSTGRES_DB: holiaokho
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holiaokho"]
      interval: 5s
      timeout: 3s
      retries: 20

  holiaokho:
    # The published image, so trying it out is a pull rather than a build.
    # Pin a release with HOLIAOKHO_VERSION=1.4.0; add --build to run your own
    # checkout instead.
    image: ghcr.io/andyshiu/holiaokho:${HOLIAOKHO_VERSION:-latest}
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOLIAOKHO_DATABASE_URL: postgres://holiaokho:holiaokho@postgres:5432/holiaokho?sslmode=disable
      # Only used to create the admin account on the very first start. The
      # account cannot do anything until this password is replaced at first
      # login, so it is a starting point rather than a secret.
      HOLIAOKHO_ADMIN_PASSWORD: Holiaokho-First-Login-1
      # Encrypts stored credentials (upstream passwords, LDAP/OIDC/SMTP
      # secrets, S3 keys). Left unset so the server generates one into the
      # data volume on first start — that file is what you back up. To supply
      # your own instead, set HOLIAOKHO_SECRET_KEY.
      HOLIAOKHO_SECRET_KEY_FILE: /data/secret.key
      HOLIAOKHO_LOG_FORMAT: json
    ports:
      - "8081:8081"
      # Docker port connectors: expose every httpPort you configure on docker repositories.
      - "8082:8082"
    volumes:
      - blobs:/data

volumes:
  pgdata:
  blobs:
