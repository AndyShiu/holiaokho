# Drop-in replacement for the company Nexus deployment: same namespace shape,
# same NodePorts (8081→32081, 8082→32082). Apply with:
#   kubectl apply -f deploy/k8s/holiaokho.yaml
# then scale the Nexus deployment to 0 once the import has been verified.
apiVersion: v1
kind: Namespace
metadata:
  name: holiaokho
---
apiVersion: v1
kind: Secret
metadata:
  name: holiaokho-db
  namespace: holiaokho
type: Opaque
stringData:
  POSTGRES_DB: holiaokho
  POSTGRES_USER: holiaokho
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://holiaokho:change-me@holiaokho-postgres:5432/holiaokho?sslmode=disable
  ADMIN_PASSWORD: change-me-too
  SECRET_KEY: change-me-three   # encrypts stored credentials; keep it safe
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holiaokho-data
  namespace: holiaokho
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holiaokho-pgdata
  namespace: holiaokho
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holiaokho-postgres
  namespace: holiaokho
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: holiaokho-postgres } }
  template:
    metadata: { labels: { app: holiaokho-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: holiaokho-db }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "holiaokho"] }
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: holiaokho-pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: holiaokho-postgres
  namespace: holiaokho
spec:
  selector: { app: holiaokho-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holiaokho
  namespace: holiaokho
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: holiaokho } }
  template:
    metadata: { labels: { app: holiaokho } }
    spec:
      containers:
        - name: holiaokho
          image: holiaokho/holiaokho:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: HOLIAOKHO_DATABASE_URL
              valueFrom: { secretKeyRef: { name: holiaokho-db, key: DATABASE_URL } }
            - name: HOLIAOKHO_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: holiaokho-db, key: ADMIN_PASSWORD } }
            - name: HOLIAOKHO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: holiaokho-db, key: SECRET_KEY } }
            - { name: HOLIAOKHO_STORAGE_PATH, value: /data/blobs }
            - { name: HOLIAOKHO_LOG_FORMAT, value: json }
          ports:
            - { name: http, containerPort: 8081 }
            - { name: docker-hub, containerPort: 8082 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: holiaokho-data }
---
apiVersion: v1
kind: Service
metadata:
  name: holiaokho-nodeport
  namespace: holiaokho
spec:
  type: NodePort
  selector: { app: holiaokho }
  ports:
    - { name: http, port: 8081, targetPort: 8081, nodePort: 32081 }
    - { name: docker-hub, port: 8082, targetPort: 8082, nodePort: 32082 }
