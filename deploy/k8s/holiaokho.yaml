# Holiaokho, standing on its own: its own namespace, its own database, no
# leftovers from the Nexus install it replaced.
#
# Secrets are NOT in this file. Create them first — the values never touch
# disk or version control:
#
#   kubectl create namespace holiaokho
#   kubectl -n holiaokho create secret generic holiaokho-db \
#     --from-literal=POSTGRES_DB=holiaokho \
#     --from-literal=POSTGRES_USER=holiaokho \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"
#   kubectl -n holiaokho create secret generic holiaokho-app \
#     --from-literal=secret-key="$(openssl rand -base64 32)" \
#     --from-literal=admin-password='<the password you want to log in with>'
#
# Then:  kubectl apply -f deploy/k8s/holiaokho.yaml
#
# NodePort 32081/32082 are the same ports the old Nexus served, so CI/CD
# configuration needs no change. Only one Service in the cluster can hold a
# NodePort, so any older Service using them must be deleted first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holiaokho-data
  namespace: holiaokho
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holiaokho-pgdata
  namespace: holiaokho
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holiaokho-postgres
  namespace: holiaokho
  labels:
    app.kubernetes.io/name: holiaokho
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: holiaokho-postgres } }
  template:
    metadata: { labels: { app: holiaokho-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: holiaokho-db }
          env:
            # The volume root is lost+found on some storage classes, so give
            # PostgreSQL a subdirectory of its own to initialise into.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "holiaokho", "-d", "holiaokho"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: holiaokho-pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: holiaokho-postgres
  namespace: holiaokho
spec:
  selector: { app: holiaokho-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holiaokho
  namespace: holiaokho
  labels:
    app.kubernetes.io/name: holiaokho
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: holiaokho } }
  template:
    metadata:
      labels:
        app: holiaokho
        app.kubernetes.io/name: holiaokho
    spec:
      # The image runs as uid 10001, which cannot write to a freshly
      # provisioned volume without this.
      securityContext:
        fsGroup: 10001
      containers:
        - name: holiaokho
          image: holiaokho:0.1.8-dev
          # k3s runs the docker runtime on this node, so images built with
          # `docker build` on the host are already present; there is nothing
          # to pull and no registry involved.
          imagePullPolicy: Never
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: holiaokho-db, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: holiaokho-db, key: POSTGRES_PASSWORD } }
            - name: HOLIAOKHO_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@holiaokho-postgres:5432/holiaokho?sslmode=disable
            - name: HOLIAOKHO_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: holiaokho-app, key: admin-password } }
            - name: HOLIAOKHO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: holiaokho-app, key: secret-key } }
            - { name: HOLIAOKHO_LISTEN, value: ":8081" }
            - { name: HOLIAOKHO_STORAGE_PATH, value: /data/blobs }
            # HOLIAOKHO_BASE_URL is deliberately unset: absolute URLs (npm
            # tarballs, Maven redirects) are then derived from the Host header
            # of the request, which is right whether a client arrives through
            # the NodePort or the Ingress. Set it only when clients reach the
            # server at an address it cannot see — behind a proxy that rewrites
            # Host, for instance.
            - { name: HOLIAOKHO_LOG_LEVEL, value: info }
          ports:
            - { name: http, containerPort: 8081 }
            - { name: docker-hub, containerPort: 8082 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            # 4Gi, not 1Gi: a real cut-over was OOMKilled at 1Gi during the
            # first CI run. Live heap was only ~67MB — the rest was proxy
            # buffers and page cache. The process reads this limit from the
            # cgroup at startup and sets GOMEMLIMIT to 90% of it, so the Go
            # runtime collects instead of being killed.
            limits: { memory: 4Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: holiaokho-data }
---
apiVersion: v1
kind: Service
metadata:
  name: holiaokho
  namespace: holiaokho
spec:
  selector: { app: holiaokho }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    - { name: docker-hub, port: 8082, targetPort: 8082 }
---
apiVersion: v1
kind: Service
metadata:
  name: holiaokho-nodeport
  namespace: holiaokho
spec:
  type: NodePort
  selector: { app: holiaokho }
  ports:
    - { name: http, port: 8081, targetPort: 8081, nodePort: 32081 }
    - { name: docker-hub, port: 8082, targetPort: 8082, nodePort: 32082 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holiaokho
  namespace: holiaokho
spec:
  ingressClassName: traefik
  rules:
    # The Docker registry protocol needs a host of its own: clients send
    # `/v2/...` at the root and cannot be served from a path prefix.
    - host: holiao.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holiaokho
                port: { number: 8081 }
    - host: holiao-docker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holiaokho
                port: { number: 8082 }
